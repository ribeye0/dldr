[package]
repository.workspace = true
authors.workspace = true
name = "dldr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Fast command-line access to your DLsite library"

[[bin]]
name = "dldr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
async-trait = "0.1.92"
dldr-api = { path = "../../crates/api" }
dldr-credentials = { path = "../../crates/credentials" }
dldr-download = { path = "../../crates/download" }
dldr-library = { path = "../../crates/library" }
dldr-storage = { path = "../../crates/storage" }
futures-util = "0.3.34"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
