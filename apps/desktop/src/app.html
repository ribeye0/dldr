<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="preload" href="%sveltekit.assets%/fonts/NotoSansCJKtc-VF-2.004.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#092a83" />
    <title>DLDR — DLsite Downloader</title>
    <script>
      // Resolve before first paint; keep the key/options in sync with lib/theme.ts.
      (() => {
        let preference = "light";
        try { preference = localStorage.getItem("dldr.color-theme") || "light"; } catch {}
        const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        background: #f5faff;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        background: #0c1424;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: inherit;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
