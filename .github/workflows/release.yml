name: DLDR release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DLDR tag, e.g. v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        id: validate
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/tags/$tag:refs/tags/$tag"
          git merge-base --is-ancestor "$tag^{commit}" origin/main
          git checkout --detach "$tag"
          python3 tools/release/validate.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned implementation
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build and media prerequisites
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential curl file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libmpv2 fonts-noto-cjk ffmpeg gstreamer1.0-libav gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            python3 python3-requests dpkg-dev xz-utils zstd xvfb xauth webkit2gtk-driver dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Validate source
        run: |
          bash tools/release/scan-secrets.sh
          pnpm check
          pnpm test
          python3 tools/install/test-install-linux.py
          python3 tools/dev/test-sync-genres.py
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build candidate and source/notice archives
        run: bash tools/release/build-linux.sh
      - name: Verify packaged media and native UI
        run: dbus-run-session -- xvfb-run -a python3 tools/release/smoke-native.py target/dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dldr-linux-x86_64
          path: target/dist/release/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dldr-native-qa
          path: target/dist/qa/*
          if-no-files-found: ignore

  draft:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dldr-linux-x86_64
          path: target/dist/release
      - name: Create a draft for final review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist/release
          sha256sum --check SHA256SUMS.txt
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-state.txt; then
            [[ $(cat release-state.txt) == true ]] || { echo 'Refusing to overwrite a public release' >&2; exit 1; }
          else
            flags=(--draft)
            [[ "$TAG" != *-rc.* ]] || flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --title "DLDR ${TAG#v}" --notes-file RELEASE-NOTES.md "${flags[@]}"
          fi
          rm -f release-state.txt
          gh release upload "$TAG" ./* --clobber
