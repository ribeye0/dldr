name: CI

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan source and Git history for secrets
        run: bash tools/release/scan-secrets.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned implementation
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libmpv2 fonts-noto-cjk ffmpeg patchelf file python3 python3-requests
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Validate release metadata and installer
        run: |
          python3 tools/release/validate.py
          python3 tools/install/test-install-linux.py
          python3 tools/dev/test-sync-genres.py
          bash -n tools/release/build-linux.sh
      - name: Check frontend
        run: |
          pnpm check
          pnpm test
          pnpm build
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo test --locked -p dldr-player native_codec_probe_and_missing_file_errors -- --ignored
          cargo test --locked -p dldr-player archive_ -- --ignored --test-threads=1
          cargo test --locked -p dldr-player native_seek_recovers -- --ignored
