[package]
repository.workspace = true
authors.workspace = true
name = "dldr-library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ammonia = "4.2.5"
scraper = "0.29.0"
reqwest = { version = "0.13.5", features = ["stream"] }
tracing = "0.1.44"
async-trait = "0.1.92"
chrono = "0.4.45"
dldr-api = { path = "../api" }
dldr-credentials = { path = "../credentials" }
dldr-download = { path = "../download" }
dldr-jobs = { path = "../jobs" }
dldr-storage = { path = "../storage" }
futures-util = "0.3.34"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }
fs2 = "0.4.3"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
dldr-audit = { path = "../audit" }
dldr-archive = { path = "../archive" }
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[lints]
workspace = true
